<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1080" viewBox="0 0 1450 1080"><rect width="100%" height="100%" fill="white"/><rect x="190" y="70" width="1070" height="105" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="102" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Abrir o site → Login</text><text x="725" y="145" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">E-mail e senha; erros e bloqueios permanecem nessa tela</text><polyline points="725,175 725,220" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,204.20351388597328 725,220 733.6296596948756,204.20351388597328" fill="none" stroke="#656873" stroke-width="3"/><rect x="190" y="220" width="1070" height="105" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="252" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Senha temporária?</text><text x="725" y="295" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Sim: trocar senha; não: seguir para o painel</text><polyline points="725,325 725,370" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,354.2035138859733 725,370 733.6296596948756,354.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="190" y="370" width="1070" height="105" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="402" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Visão geral</text><text x="725" y="445" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Conferir validade e reposição; menu mostra ações permitidas</text><polyline points="725,475 725,520" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,504.2035138859733 725,520 733.6296596948756,504.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="190" y="520" width="1070" height="105" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="552" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Escolher uma tarefa</text><text x="725" y="595" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Estoque, venda, alertas, histórico, relatórios ou usuários</text><polyline points="725,625 725,670" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,654.2035138859733 725,670 733.6296596948756,654.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="190" y="670" width="1070" height="105" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="702" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Executar ou cancelar</text><text x="725" y="745" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Formulários validam; operações confirmadas atualizam os dados</text><polyline points="725,775 725,820" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,804.2035138859733 725,820 733.6296596948756,804.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="190" y="820" width="1070" height="105" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="852" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Voltar ao painel ou sair</text><text x="725" y="895" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Minha conta altera senha; Sair encerra a sessão</text></svg>