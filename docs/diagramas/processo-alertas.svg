<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1050" viewBox="0 0 1450 1050"><rect width="100%" height="100%" fill="white"/><rect x="435" y="35" width="580" height="110" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="75" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Consultar lotes ativos</text><text x="725" y="115" font-family="Arial" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="middle">Calcular dias até a validade</text><polyline points="725,145 725,220 190,220 190,310" fill="none" stroke="#656873" stroke-width="3"/><polyline points="181.37034030512433,294.2035138859733 190,310 198.62965969487564,294.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="40" y="310" width="305" height="165" fill="white" stroke="#424550" stroke-width="3"/><rect x="40" y="310" width="305" height="58" fill="#eeeeF2" stroke="#424550" stroke-width="3"/><text x="192.5" y="339" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Vencido</text><text x="58" y="400" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="middle">dias &lt; 0</text><text x="192" y="520" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Não vender</text><polyline points="725,145 725,220 545,220 545,310" fill="none" stroke="#656873" stroke-width="3"/><polyline points="536.3703403051244,294.2035138859733 545,310 553.6296596948756,294.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="395" y="310" width="305" height="165" fill="white" stroke="#424550" stroke-width="3"/><rect x="395" y="310" width="305" height="58" fill="#eeeeF2" stroke="#424550" stroke-width="3"/><text x="547.5" y="339" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Urgente</text><text x="413" y="400" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="middle">0 a 2 dias</text><text x="547" y="520" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Venda permitida</text><polyline points="725,145 725,220 900,220 900,310" fill="none" stroke="#656873" stroke-width="3"/><polyline points="891.3703403051244,294.2035138859733 900,310 908.6296596948756,294.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="750" y="310" width="305" height="165" fill="white" stroke="#424550" stroke-width="3"/><rect x="750" y="310" width="305" height="58" fill="#eeeeF2" stroke="#424550" stroke-width="3"/><text x="902.5" y="339" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">A vencer</text><text x="768" y="400" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="middle">3 a 5 dias</text><text x="902" y="520" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Venda permitida</text><polyline points="725,145 725,220 1255,220 1255,310" fill="none" stroke="#656873" stroke-width="3"/><polyline points="1246.3703403051243,294.2035138859733 1255,310 1263.6296596948757,294.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><rect x="1105" y="310" width="305" height="165" fill="white" stroke="#424550" stroke-width="3"/><rect x="1105" y="310" width="305" height="58" fill="#eeeeF2" stroke="#424550" stroke-width="3"/><text x="1257.5" y="339" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">Em dia</text><text x="1123" y="400" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" dominant-baseline="middle">mais de 5 dias</text><text x="1257" y="520" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">Venda permitida</text><rect x="160" y="640" width="1130" height="140" fill="#f3f3f6" stroke="#424550" stroke-width="3"/><text x="725" y="685" font-family="Arial" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="middle">Exibir texto, cor e prazo nas telas</text><text x="725" y="740" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle">O cálculo ocorre na consulta; não há envio de e-mail nem tarefa diária.</text><polyline points="190,540 190,590 725,590 725,640" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,624.2035138859733 725,640 733.6296596948756,624.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><polyline points="545,540 545,590 725,590 725,640" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,624.2035138859733 725,640 733.6296596948756,624.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><polyline points="900,540 900,590 725,590 725,640" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,624.2035138859733 725,640 733.6296596948756,624.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><polyline points="1255,540 1255,590 725,590 725,640" fill="none" stroke="#656873" stroke-width="3"/><polyline points="716.3703403051244,624.2035138859733 725,640 733.6296596948756,624.2035138859733" fill="none" stroke="#656873" stroke-width="3"/><text x="725" y="880" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="middle">Saldo esgotado e lote descartado possuem estados próprios.</text><text x="725" y="940" font-family="Arial" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="middle">A API sempre impede venda de lote vencido, independentemente da interface.</text></svg>