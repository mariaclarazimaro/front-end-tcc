<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doce Sabor · Gestão de Estoque e Vendas</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="style.css">

</head>
<body class="login-page">
<section id="login-screen" class="login-screen">
  <div class="login-form-wrap">
    <img src="img/logo.png" class="login-logo" alt="Doce Sabor"><div class="login-card"><form id="login-form" class="login-form">
      <p class="eyebrow">BEM-VINDO DE VOLTA</p>
      <h2>Entre na sua conta</h2>
      <p class="login-form__hint">Use seu e-mail e senha para continuar.</p>

      <label class="field">
        <span>E-mail</span>
        <input type="email" id="login-email" placeholder="voce@docesabor.com.br" autocomplete="username" required>
      </label>

      <label class="field">
        <span>Senha</span>
        <span class="password-control"><input type="password" id="login-password" placeholder="Sua senha" autocomplete="current-password" required><button id="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></span>
      </label>

      <div role="alert" id="login-error" class="field-error" hidden></div>

      <button type="submit" class="btn btn--primary btn--block">Entrar no painel</button>


    </form><form id="first-password-form" class="login-form" hidden><p class="eyebrow">PRIMEIRO ACESSO</p><h2>Defina sua senha</h2><p class="login-form__hint">Crie uma senha pessoal com pelo menos 12 caracteres, maiúscula, minúscula e número.</p><label class="field"><span>Senha temporária</span><input type="password" id="initial-password" autocomplete="current-password" required></label><label class="field"><span>Nova senha</span><input type="password" id="first-new-password" minlength="12" maxlength="64" autocomplete="new-password" required></label><label class="field"><span>Confirmar nova senha</span><input type="password" id="first-confirm-password" minlength="12" autocomplete="new-password" required></label><p id="first-password-error" class="field-error" role="alert" hidden></p><button type="submit" class="btn btn--primary btn--block">Salvar e continuar</button><button type="button" id="first-password-logout" class="btn btn--ghost btn--block">Sair</button></form><p class="login-help">Precisa de acesso? Fale com o administrador da sua equipe.</p></div><p class="login-copyright">Doce Sabor · Gestão de estoque e vendas</p>
  </div>
</section>

<script src="access.js"></script><script src="auth.js"></script><script src="login.js"></script></body></html>
